<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Night Sky</title>
<meta name="description" content="A todo list where every task is a star. Finish it and it joins this week's constellation. Miss it and it burns out.">
<meta name="theme-color" content="#030407">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icons/favicon.svg" type="image/svg+xml">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Night Sky">
<link rel="preload" href="./fonts/IBMPlexMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="./fonts/IBMPlexMono-Medium.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"IBM Plex Mono";src:url("./fonts/IBMPlexMono-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:block}
@font-face{font-family:"IBM Plex Mono";src:url("./fonts/IBMPlexMono-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:block}
html,body{margin:0;background:#030407;overflow:hidden;height:100%;touch-action:none}
body{color:#f1ead6;font-family:"IBM Plex Mono",ui-monospace,Consolas,"Courier New",monospace;-webkit-tap-highlight-color:transparent}
canvas{display:block;margin:0 auto}
/* the real input: visually hidden, still focusable, so IME, paste and mobile keyboards work */
#bar-form{margin:0;padding:0;border:0}
#bar-input{position:fixed;left:50%;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;background:transparent;color:transparent;caret-color:transparent;z-index:-1;pointer-events:none}
/* touch: the input lies over the bar (rect set by bar.js), so a tap is a native tap on it and the soft keyboard opens */
#bar-input.over{z-index:5;pointer-events:auto;outline:0;-webkit-tap-highlight-color:transparent}
#bar-input::selection{background:transparent}
#live{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
#safe{position:fixed;left:0;bottom:0;width:0;height:0;padding-bottom:env(safe-area-inset-bottom)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<form id="bar-form" action="javascript:void(0)" autocomplete="off"><input id="bar-input" type="text" inputmode="text" enterkeyhint="done" autocomplete="off" autocorrect="on" autocapitalize="sentences" spellcheck="false" aria-label="Add a star: title, deadline"></form>
<div id="live" aria-live="polite"></div>
<div id="safe"></div>
<noscript>Night Sky needs JavaScript.</noscript>
<script>window.addEventListener('error', e => { document.documentElement.setAttribute('data-err', (e.message || '') + ' @' + (e.filename || '') + ':' + (e.lineno || 0)); });
window.addEventListener('unhandledrejection', e => { document.documentElement.setAttribute('data-err', 'reject ' + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)); });</script>
