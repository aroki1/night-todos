<!doctype html>
<html><head><meta charset="utf-8"><title>Night Sky · steps</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#030407;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c"></canvas>
<script>
/* steps prototype: companion ring (max 8 points, fills by done count) + pacing urgency.
   click a star · click a step to toggle · space = finish next step · [ ] = move time · esc */
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
const C = { ink: hex('#f1ead6'), ink2: hex('#b6af9a'), done: hex('#d3dfff'), cold: hex('#9fb8ff'), amb: hex('#f0a050'), ambC: hex('#ffd9a8') };
const T = { ink: '#f1ead6', ink2: '#b6af9a', dim: '#575b66', amb: '#eda55a', cold: '#9fb8ff' };
const BAR = 16, RING = 8, KMAX = 8;
let dpr, P, GW, GH, SH, buf, base, img;

function rng(a) { return () => { a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const tasks = [
  { t: 'hm one-pager', x: .2, y: .36, life: .86, days: 7, steps: ['outline', 'collect numbers', 'draft', 'send to mentors'], done: [1, 0, 0, 0] },
  { t: 'os linux hw 3', x: .52, y: .62, life: .3, days: 4, steps: ['read lab spec', 'set up vm', 'task 1', 'task 2', 'task 3', 'write report'], done: [1, 0, 0, 0, 0, 0] },
  { t: 'lit review', x: .74, y: .3, life: .5, days: 14, steps: Array.from({ length: 20 }, (_, i) => 'paper ' + (i + 1)), done: Array.from({ length: 20 }, (_, i) => +(i < 13)) },
  { t: 'call dentist', x: .34, y: .78, life: .6, days: 2, steps: [], done: [] },
];
tasks.forEach(s => { s.f = s.done.slice(); s.scroll = 0; s.showDone = false; });

const nDone = s => s.done.reduce((a, b) => a + b, 0);
const urgent = s => s.life < .25 || (s.steps.length > 0 && (1 - s.life) > nDone(s) / s.steps.length + .3);
const left = s => { const h = s.life * s.days * 24; return h >= 24 ? Math.round(h / 24) + 'd' : h >= 1 ? Math.round(h) + 'h' : Math.round(h * 60) + 'm'; };

function resize() {
  if (!innerWidth || !innerHeight) return setTimeout(resize, 100);
  dpr = devicePixelRatio || 1; P = Math.max(3, Math.round(3 * dpr));
  GW = Math.floor(innerWidth * dpr / P); GH = Math.floor(innerHeight * dpr / P); SH = GH - BAR;
  cv.width = GW * P; cv.height = GH * P; cv.style.width = cv.width / dpr + 'px'; cv.style.height = cv.height / dpr + 'px';
  buf = new Float32Array(GW * GH * 3); base = new Float32Array(GW * GH * 3);
  img = ctx.createImageData(cv.width, cv.height);
  const d = img.data; for (let o = 0; o < d.length; o += 4) { d[o] = 3; d[o + 1] = 4; d[o + 2] = 7; d[o + 3] = 255; }
  const r = rng(11);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const i = (y * GW + x) * 3, t = y / SH;
    if (y >= SH) { base[i] = .006; base[i + 1] = .007; base[i + 2] = .012; continue; }
    base[i] = .022 + .03 * t; base[i + 1] = .024 + .012 * t; base[i + 2] = .042 - .02 * t;
  }
  for (let k = 0; k < GW * SH / 80; k++) {
    const x = r() * GW | 0, y = r() * SH | 0, b = r() ** 3 * .55 + .04, i = (y * GW + x) * 3, w = r();
    if (tasks.some(s => (Math.round(s.x * GW) - x) ** 2 + (Math.round(s.y * SH) - y) ** 2 < 12 * 12)) continue;
    base[i] += b; base[i + 1] += b * .95; base[i + 2] += b * (.8 + w * .35);
  }
  tasks.forEach(s => { s.gx = Math.round(s.x * GW); s.gy = Math.round(s.y * SH); });
}

function add(x, y, c, a) { if (x < 0 || y < 0 || x >= GW || y >= SH) return; const i = (y * GW + x) * 3; buf[i] += c[0] * a; buf[i + 1] += c[1] * a; buf[i + 2] += c[2] * a; }
function splat(fx, fy, c, a) { const x = Math.floor(fx), y = Math.floor(fy), u = fx - x, v = fy - y; add(x, y, c, a * (1 - u) * (1 - v)); add(x + 1, y, c, a * u * (1 - v)); add(x, y + 1, c, a * (1 - u) * v); add(x + 1, y + 1, c, a * u * v); }
function halo(cx, cy, c, a, s, R) { for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) { const d = dx * dx + dy * dy; if (d <= R * R) add(cx + dx, cy + dy, c, a * Math.exp(-d / (s * s))); } }

function drawStar(s, hot, now) {
  const u = urgent(s), core = u ? C.ambC : C.ink, arm = u ? C.amb : C.ink2;
  const b = u ? .75 + .25 * Math.sin(now / 900 + s.gx) : 1;
  halo(s.gx, s.gy, u ? C.amb : C.ink, (u ? .17 : .08) * b * (hot ? 1.5 : 1), 2.6, 7);
  add(s.gx, s.gy, core, 1);
  const L = 1 + s.life * 4;
  for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]])
    for (let k = 1; k <= Math.ceil(L); k++) add(s.gx + dx * k, s.gy + dy * k, k === 1 ? core : arm, Math.min(1, L - k + 1) * (k === 1 ? .8 : .5 / k) * b);
  const n = s.steps.length; if (!n) return;
  const K = Math.min(n, KMAX), filled = s.f.reduce((a, v) => a + v, 0) * K / n, m = hot ? 1.8 : 1;
  for (let i = 0; i < K; i++) {
    const f = Math.max(0, Math.min(1, filled - i)), ang = -Math.PI / 2 + i / K * Math.PI * 2;
    const px = s.gx + RING * Math.cos(ang), py = s.gy + RING * Math.sin(ang);
    const qx = Math.round(px), qy = Math.round(py);
    add(qx, qy, C.ink2, .3 * (1 - f) * m);
    add(qx, qy, C.done, .85 * f * m);
    if (f > 0) halo(qx, qy, C.cold, .05 * f * m, 1.2, 2);
  }
}

function blit() {
  const d = img.data, w = cv.width, dot = P - 1;
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const i = (y * GW + x) * 3, r = Math.min(255, buf[i] * 255 + 3), g = Math.min(255, buf[i + 1] * 255 + 4), b = Math.min(255, buf[i + 2] * 255 + 7);
    for (let yy = 0; yy < dot; yy++) { let o = ((y * P + yy) * w + x * P) * 4; for (let xx = 0; xx < dot; xx++, o += 4) { d[o] = r; d[o + 1] = g; d[o + 2] = b; } }
  }
  ctx.putImageData(img, 0, 0);
}

let mouse = { x: -1, y: -1 }, hover = null, sel = null, rows = [];
function text(str, x, y, col, weight) { ctx.font = (weight || 400) + ' 12px "IBM Plex Mono", monospace'; ctx.fillStyle = col; ctx.fillText(str, x, y); return ctx.measureText(str).width; }

function labels() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0); rows = [];
  for (const s of tasks) {
    const n = s.steps.length, d = nDone(s), u = urgent(s), open = sel === s || hover === s;
    const x = (s.gx + (n ? RING + 3 : 5)) * P / dpr, y = s.gy * P / dpr - 2;
    text(s.t, x, y, T.ink, 500);
    const nextI = s.done.indexOf(0);
    let l2 = left(s);
    if (n) l2 = (open && nextI >= 0 && sel !== s ? 'next: ' + s.steps[nextI] + ' · ' : '') + d + '/' + n + ' · ' + left(s);
    text(l2, x, y + 17, u ? T.amb : T.dim);
    if (sel !== s || !n) continue;
    let ly = y + 40;
    const row = (str, col, act) => { const hot = mouse.x >= x && mouse.x <= x + 200 && mouse.y > ly - 12 && mouse.y < ly + 5; text(str, x, ly, hot && act ? T.ink : col); if (act) rows.push({ y0: ly - 12, y1: ly + 5, x, act }); ly += 17; };
    if (d) row((s.showDone ? '▾ ' : '▸ ') + d + ' done', T.cold, () => s.showDone = !s.showDone);
    if (s.showDone) s.steps.forEach((t, i) => s.done[i] && row('  ' + t, T.cold, () => s.done[i] = 0));
    const openI = s.steps.map((_, i) => i).filter(i => !s.done[i]);
    s.scroll = Math.max(0, Math.min(s.scroll, openI.length - 5));
    openI.slice(s.scroll, s.scroll + 5).forEach(i => row('· ' + s.steps[i], T.ink2, () => s.done[i] = 1));
    if (openI.length > s.scroll + 5) row('+' + (openI.length - s.scroll - 5) + ' more', T.dim, () => s.scroll += 5);
  }
  const by = (SH + BAR / 2) * P / dpr + 4;
  text('›', 14, by, T.ink2); text('title, deadline / step / step', 34, by, T.dim);
  const hint = sel ? 'space next step · [ ] time · esc' : 'click a star';
  ctx.font = '400 12px "IBM Plex Mono", monospace';
  text(hint, innerWidth - ctx.measureText(hint).width - 16, by, T.dim);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

function frame(now) {
  if (!img) return requestAnimationFrame(frame);
  for (const s of tasks) for (let j = 0; j < s.f.length; j++) s.f[j] += (s.done[j] - s.f[j]) * .08;
  buf.set(base);
  for (const s of tasks) drawStar(s, s === hover || s === sel, now);
  blit(); labels();
  requestAnimationFrame(frame);
}

function starAt(cx, cy) {
  const gx = cx * dpr / P, gy = cy * dpr / P; let best = null, bd = 11 * 11;
  for (const s of tasks) { const d = (s.gx - gx) ** 2 + (s.gy - gy) ** 2; if (d < bd) { bd = d; best = s; } }
  return best;
}
addEventListener('mousemove', e => { mouse = { x: e.clientX, y: e.clientY }; hover = starAt(e.clientX, e.clientY); cv.style.cursor = hover || rows.some(r => e.clientY > r.y0 && e.clientY < r.y1 && e.clientX >= r.x) ? 'pointer' : 'default'; });
addEventListener('click', e => {
  const r = rows.find(r => e.clientY > r.y0 && e.clientY < r.y1 && e.clientX >= r.x && e.clientX <= r.x + 200);
  if (r) return r.act();
  sel = starAt(e.clientX, e.clientY);
});
addEventListener('wheel', e => { if (sel) sel.scroll += Math.sign(e.deltaY); });
addEventListener('keydown', e => {
  if (!sel) return;
  if (e.key === 'Escape') sel = null;
  else if (e.key === ' ') { const i = sel.done.indexOf(0); if (i >= 0) sel.done[i] = 1; e.preventDefault(); }
  else if (e.key === '[') sel.life = Math.max(.02, sel.life - .05);
  else if (e.key === ']') sel.life = Math.min(1, sel.life + .05);
});
addEventListener('resize', resize);
resize(); requestAnimationFrame(frame);
</script></body></html>
