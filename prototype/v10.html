/* =====================================================================

/* =====================================================================

    return { moonMax: moonSt.show ? mx(moonSt.x - 6, moonSt.y - 6, moonSt.x + 7, moonSt.y + 7) : 0, starCore: mx(stars[3].gx - 1, stars[3].gy - 1, stars[3].gx + 2, stars[3].gy + 2), starCore2: mx(stars[4].gx, stars[4].gy, stars[4].gx + 1, stars[4].gy + 1) }; },
  forceShower(v) { forceShower = !!v; },
  freeze(t) { frozen = true; cancelAnimationFrame(rafId); T = t; ns.render(); },
  finish(name, atT, hov) { return doFinish(findStar(name), atT, hov); },
  undo(atT) { doUndo(atT); },
  hover(name) { forceFocus = name === null ? null : findStar(name); const f = forceFocus === null ? -1 : forceFocus; focus = f;
    for (let i = 0; i < NS; i++) { hp[i] = hk[i] = i === f ? 1 : 0; frK[i] = (i === f && !stars[i].done && !stars[i].miss) ? 1 : 0; } },
  skySwap(seed, atT) { skySwap(seed, atT); },
  nextSeed: null,
  move(name, gx, gy) { const s = stars[findStar(name)]; s.gx = gx; s.gy = gy; },
  render() { cloudT = -9; wc.T = -99; frozenForce = true; focus = forceFocus !== null ? forceFocus : mouseHover >= 0 ? mouseHover : selIdx; render(); frozenForce = false; },
  bench(n) { const t0 = T; let sum = 0, mx = 0, fr = []; cancelAnimationFrame(rafId); frozen = false; cloudT = -9;
    for (let i = 0; i < n; i++) { T = t0 + i / 60; const a = performance.now(); prepare(); compose(); blit(); const d = performance.now() - a; sum += d; fr.push(d); if (i > 10) mx = Math.max(mx, d); }
    frozen = true; fr.sort((x, y) => x - y); return { avg: sum / n, median: fr[n >> 1], p95: fr[Math.floor(n * .95)], max: mx }; },
  now() { return T; },
  selfTest() { return selfTest(); },
  typeTrace(str) { const out = []; ns.key('n'); for (const ch of str) { ns.key(ch === ' ' ? 'Space' : ch); ns.advance(170); const g = stars[GHI]; out.push([bar.text.length, +g.ghA.toFixed(2), g.gx, g.gy].join(':')); } return out.join(' '); },
  clock(iso) { clockBase = new Date(iso).getTime() - T * 1000; cloudT = -9; },
  dbg() { return { T, wall: new Date(wall(T)).toString(), bar: { text: bar.text, title: bar.title, pv: bar.pv, focus: bar.focus, gpos: bar.gpos, gOn: bar.gOn }, ghost: { x: stars[GHI].gx, y: stars[GHI].gy, a: stars[GHI].ghA }, n: stars.length, pipTotal, events: events.length, stars: stars.map(s => [s.n, s.gx, s.gy, s.on, s.done, s.miss]) }; },
  advance(ms) { const n = Math.max(1, Math.round(ms / 16.667)), dt = ms / 1000 / n; for (let i = 0; i < n; i++) { T += dt; focus = forceFocus !== null ? forceFocus : mouseHover >= 0 ? mouseHover : selIdx; updateHover(dt); if (ns.onStep) ns.onStep(dt); } ns.render(); },
  key(spec) { const parts = spec.split('+'), k = parts.pop(); window.dispatchEvent(new KeyboardEvent('keydown', { key: k === 'Space' ? ' ' : k, ctrlKey: parts.indexOf('ctrl') >= 0, shiftKey: parts.indexOf('shift') >= 0, bubbles: true, cancelable: true })); ns.render(); },
  type(str) { for (const ch of str) ns.key(ch === ' ' ? 'Space' : ch); },
  clickAt(ux, uy) { const r = cv.getBoundingClientRect(); cv.dispatchEvent(new MouseEvent('click', { clientX: r.left + ux / UW * r.width, clientY: r.top + uy / UH * r.height, bubbles: true })); ns.render(); },
  click(what) { if (what === 'sky') ns.clickAt(skyBtn.x + skyBtn.w / 2, skyBtn.y + skyBtn.h / 2); else if (what === 'undo') ns.clickAt((undoHit.x0 + undoHit.x1) / 2 * 3, 618);
    else { const s = stars[findStar(what)]; ns.clickAt(s.gx * 3 + 1, s.gy * 3 + 1); } },
  script(str) { frozen = true; cancelAnimationFrame(rafId);
    for (const tok of str.split(';')) { const i = tok.indexOf(':'), c = i < 0 ? tok : tok.slice(0, i), a = i < 0 ? '' : tok.slice(i + 1);
      if (c === 'fz') ns.freeze(+a); else if (c === 'adv') ns.advance(+a); else if (c === 'key') ns.key(a); else if (c === 'type') ns.type(a); else if (c === 'click') ns.click(a);
      else if (c === 'move') { const q = a.split(','); ns.move(q[0], +q[1], +q[2]); ns.render(); } else if (c === 'fin') { ns.finish(a.split(',')[0], +a.split(',')[1], false); }
      else if (c === 'und') ns.undo(+a); else if (c === 'next') ns.nextSeed = +a; else if (c === 'hover') { ns.hover(a === '' ? null : a); ns.render(); } else if (c === 'render') ns.render(); else if (c === 'sat') ns.freeze(satTime(a === '1')); else if (c === 'shower') { forceShower = a === '1'; } else if (c === 'dbg') document.documentElement.setAttribute('data-out', JSON.stringify(ns.dbg())); else if (c === 'eval') document.documentElement.setAttribute('data-out', JSON.stringify(eval(a))); } },
  stats() { return { ms: msAvg, grains: N, dpr, P, D }; }
};

/* ---------- boot ---------- */
(async function boot() {
  cv = document.getElementById('c'); ctx = cv.getContext('2d'); setupCanvas();
  const fontsReady = Promise.race([Promise.all([document.fonts.load('400 12px "IBM Plex Mono"'), document.fonts.load('500 12px "IBM Plex Mono"')]), new Promise(r => setTimeout(r, 3000))]);
  makeSky(Q.has('seed') ? +Q.get('seed') : Math.floor(Math.random() * 1e9));
  await fontsReady; widthCache.clear();
  const scene = Q.get('scene'), at = Q.has('at') ? +Q.get('at') : null; let tFreeze = Q.has('t') ? +Q.get('t') : 0, freeze = Q.get('freeze') === '1';
  const sname = Q.get('star');
  if (scene === 'finish' || scene === 'urgent') { const nm = sname || (scene === 'urgent' ? 'os linux hw 3' : 'patterns quiz prep'); ns.finish(nm, 2.0, false); tFreeze = 2.0 + (at === null ? 850 : at) / 1000; freeze = true; }
  else if (scene === 'overlap') { ns.finish('patterns quiz prep', 2.0, false); ns.finish('os linux hw 3', 2.3, false); tFreeze = 2.0 + (at === null ? 1200 : at) / 1000; freeze = true; }
  else if (scene === 'undo') { ns.finish(sname || 'patterns quiz prep', 2.0, false); ns.undo(4.0); tFreeze = Q.has('t') ? tFreeze : 4.0 + (at === null ? 350 : at) / 1000; freeze = true; }
  else if (scene === 'labels') { ns.move('hm one-pager', 394, 40); ns.move('os linux hw 3', 62, 90); ns.move('patterns quiz prep', 392, 124); freeze = true; }
  else if (scene === 'occlusion') { ns.move('os linux hw 3', 123, 73); ns.finish('patterns quiz prep', 2.0, false); tFreeze = 2.0 + (at === null ? 2600 : at) / 1000; freeze = true; }
  else if (scene === 'expire') { const s = stars[findStar('os linux hw 3')]; s.dl = wall(0) + 2000; s.lifeFix = .13; tFreeze = 2.0 + (at === null ? 400 : at) / 1000; freeze = true; }
  else if (scene === 'crossfade') { ns.skySwap(+(Q.get('seed2') || 11), tFreeze); tFreeze += (at === null ? 450 : at) / 1000; freeze = true; }
  if (Q.has('hover')) ns.hover(Q.get('hover'));
  if (Q.has('script')) { bindInput(); ns.script(Q.get('script')); document.documentElement.setAttribute('data-ready', '1'); return; }
  bindInput();
  window.addEventListener('resize', () => { if (Math.abs((window.devicePixelRatio || 1) - dpr) > .001) { setupCanvas(); widthCache.clear(); } });
  if (Q.get('bench') === '1') { const r = ns.bench(+Q.get('frames') || 120); document.title = 'bench ' + JSON.stringify(r) + ' P' + P + ' D' + D; return; }
  if (freeze) ns.freeze(tFreeze); else { T = tFreeze; ns.render(); requestAnimationFrame(ts => { lastTs = ts; rafId = requestAnimationFrame(loop); }); }
  document.documentElement.setAttribute('data-ready', '1');
})();
</script>
