<canvas id="c"></canvas>
<script>
'use strict';
/* =====================================================================
   NIGHT SKY v9: stabilize + the finishing moment
   Single file, no libraries. Everything in the sky is a value written
   into a grain framebuffer (GW x SH grains, 2x2-ish dots on a 3px pitch).
   Only text, the 1px hover frame and the bottom bar live outside it.
   ===================================================================== */

/* =====================================================================
   1. CONSTANTS AND TOKENS
   ===================================================================== */
const GW = 404, SH = 196, ROWS = 216, N = GW * SH;   // sky grains, total grain rows (sky + bar)
const UW = GW * 3, UH = ROWS * 3, BARY = SH * 3;     // layout units: 3 units per grain (= CSS px at 1x)
const FONT = '"IBM Plex Mono", ui-monospace, Consolas, monospace';

const TXT = { ink: '#f1ead6', ink2: '#b6af9a', dim: '#575b66', warn: '#eda55a',
              done: '#9db1f0', pipOff: '#2a2d35', bg: '#030407', rule: '#181b24' };
const hex = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const K = { ink: hex(TXT.ink), ink2: hex(TXT.ink2), dim: hex(TXT.dim), warn: hex(TXT.warn), done: hex(TXT.done), pipOff: hex(TXT.pipOff) };

// light colour table (unchanged from v8)
const C = { ink: hex('#f1ead6'), ink2: hex('#b6af9a'), done: hex('#d3dfff'), core: hex('#ffffff'), glint: hex('#a8bbf2'),
            warm: hex('#f5e3bb'), warmC: hex('#fff6e0'), cold: hex('#9fb8ff'), amb: hex('#f0a050'), ambC: hex('#ffd9a8'),
            ambS: hex('#eda55a'), ash: hex('#43464e'), line: hex('#c4d2ff'), lineG: hex('#6e8cff'), pulse: hex('#d0dcff'),
            met: hex('#e8eeff') };

const PAL = [
  { top: '#070912', bot: '#101830', hz: [80, 105, 180],  cl: [[58, 82, 160], [92, 64, 150]],  tint: ['#e3e9ff', '#cdd8ff', '#ffe7c8'] },
  { top: '#09070f', bot: '#1a1230', hz: [150, 95, 175],  cl: [[110, 64, 150], [52, 78, 150]], tint: ['#efe6ff', '#d9ccff', '#ffdcc8'] },
  { top: '#050a0d', bot: '#0a1f24', hz: [60, 150, 140],  cl: [[30, 112, 106], [44, 80, 124]], tint: ['#e2fbff', '#cdeaf0', '#fff1d6'] },
  { top: '#09080c', bot: '#1f1715', hz: [190, 115, 75],  cl: [[124, 76, 58], [60, 64, 108]],  tint: ['#fff0dc', '#e8e4ff', '#ffd2a8'] },
  { top: '#07070a', bot: '#111119', hz: [125, 125, 150], cl: [[64, 70, 98], [50, 56, 82]],    tint: ['#f2f2ff', '#d8dcf0', '#fff0dd'] }];

const Q = new URLSearchParams(location.search);
const REDUCED = Q.get('reduced') === '1' || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const DEBUG = Q.get('debug') === '1';

// device pixel ratio geometry (set in setupCanvas)
let dpr = 1, P = 3, D = 2, cv, ctx, img, u32;
const BGPIX = (255 << 24) | (7 << 16) | (4 << 8) | 3;   // #030407, also the gap colour between dots

/* =====================================================================
   2. MATH AND NOISE
   ===================================================================== */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp01((t - a) / (b - a));      // progress of t inside [a, b]
const ease = { out: p => 1 - Math.pow(1 - p, 3), inOut: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, in: p => p * p * p };
const H = (a, b) => { const t = Math.sin(a * 127.1 + b * 311.7) * 43758.5453; return t - Math.floor(t); };

const vn = (px, py, o) => { const ix = Math.floor(px), iy = Math.floor(py), fx = px - ix, fy = py - iy, s = t => t * t * (3 - 2 * t);
  const a = H(ix + o, iy), b = H(ix + 1 + o, iy), c = H(ix + o, iy + 1), d = H(ix + 1 + o, iy + 1);
  return a + (b - a) * s(fx) + (c - a) * s(fy) + (a - b - c + d) * s(fx) * s(fy); };
const fbm = (px, py, o) => { let v = 0, a = .5, f = 1; for (let k = 0; k < 4; k++) { v += a * vn(px * f, py * f, o); f *= 2.03; a *= .5; } return v / .94; };
const sm = (e0, e1, v) => { const t = clamp01((v - e0) / (e1 - e0)); return t * t * (3 - 2 * t); };
const tone = v => { v = v < .82 ? v : .82 + .18 * (1 - Math.exp(-(v - .82) * 5)); return v <= 0 ? 0 : v >= 1 ? 255 : (v * 255) | 0; };
const TONE = new Uint8Array(4097); for (let q = 0; q <= 4096; q++) TONE[q] = tone(q / 4096);
const tn8 = v => v <= 0 ? 0 : v >= 1 ? 255 : TONE[(v * 4096) | 0];
const SC = [0, 0, 0];                                      // scratch colour (no per-grain allocation)
function mixTo(out, a, b, t) { out[0] = a[0] + (b[0] - a[0]) * t; out[1] = a[1] + (b[1] - a[1]) * t; out[2] = a[2] + (b[2] - a[2]) * t; return out; }
const css = c => 'rgb(' + ((c[0] * 255 + .5) | 0) + ',' + ((c[1] * 255 + .5) | 0) + ',' + ((c[2] * 255 + .5) | 0) + ')';

/* =====================================================================
   3. FRAMEBUFFER: add, over, splat, halo, ring, dimRect
   ===================================================================== */
const BR = new Float32Array(N), BG = new Float32Array(N), BB = new Float32Array(N);       // composed light
const SR = new Float32Array(N), SG = new Float32Array(N), SB = new Float32Array(N);       // sky gradient
const CR = new Float32Array(N), CG = new Float32Array(N), CB = new Float32Array(N);       // gradient + clouds (refreshed with the clouds)
const OR = new Float32Array(N), OG = new Float32Array(N), OB = new Float32Array(N);       // old base (crossfade)

function add(i, j, c, w) { if (i < 0 || j < 0 || i >= GW || j >= SH || w <= 0) return; const k = j * GW + i; BR[k] += c[0] * w; BG[k] += c[1] * w; BB[k] += c[2] * w; }
function over(i, j, c, a) { if (i < 0 || j < 0 || i >= GW || j >= SH || a <= 0) return; const k = j * GW + i; a = a > 1 ? 1 : a;
  BR[k] += (c[0] - BR[k]) * a; BG[k] += (c[1] - BG[k]) * a; BB[k] += (c[2] - BB[k]) * a; }
// bilinear splat by fractional position: anything that moves glides across grains
function splat(fx, fy, c, w) { const i = Math.floor(fx), j = Math.floor(fy); let u = fx - i, v = fy - j; u = u * u * (3 - 2 * u); v = v * v * (3 - 2 * v);
  add(i, j, c, w * (1 - u) * (1 - v)); add(i + 1, j, c, w * u * (1 - v)); add(i, j + 1, c, w * (1 - u) * v); add(i + 1, j + 1, c, w * u * v); }
function halo(fx, fy, c, peak, sig, rad) { if (peak <= .002) return; const r = Math.ceil(rad), i0 = Math.round(fx), j0 = Math.round(fy), k2 = 1 / (2 * sig * sig), r2 = rad * rad;
  for (let j = j0 - r; j <= j0 + r; j++) for (let i = i0 - r; i <= i0 + r; i++) { const d2 = (i - fx) * (i - fx) + (j - fy) * (j - fy); if (d2 > r2) continue; add(i, j, c, peak * Math.exp(-d2 * k2)); } }
// one ring of light: profile exp(-d^2/0.45), per-grain sparkle
function ring(cx, cy, rad, b, col) { if (b <= .002) return; const ri = Math.ceil(rad + 2);
  for (let j = -ri; j <= ri; j++) for (let i = -ri; i <= ri; i++) { const d = Math.abs(Math.sqrt(i * i + j * j) - rad); if (d < 1.6) add(cx + i, cy + j, col, b * Math.exp(-d * d / .45) * (.6 + .4 * H(cx + i, cy + j))); } }
// terminal-style cell background: x0..x1, y0..y1 half-open; outermost ring is feathered
function dimRect(x0, y0, x1, y1, vis) {              // feather: outer ring x0.75, second ring x0.625, core x0.5
  const f0 = 1 - (1 - .75) * vis, f1 = 1 - (1 - .625) * vis, fi = 1 - (1 - .5) * vis;
  for (let j = Math.max(0, y0); j < Math.min(SH, y1); j++) for (let i = Math.max(0, x0); i < Math.min(GW, x1); i++) {
    const e = Math.min(i - x0, x1 - 1 - i, j - y0, y1 - 1 - j), f = e === 0 ? f0 : e === 1 ? f1 : fi, k = j * GW + i; BR[k] *= f; BG[k] *= f; BB[k] *= f; } }

/* =====================================================================
   4. SKY
   ===================================================================== */
let sky = null, T = 0, cloudT = -9, xf = null;
function makeSky(seed) {
  const r = rng(seed), pal = PAL[Math.floor(r() * PAL.length)], off = Math.floor(r() * 900), top = hex(pal.top), bot = hex(pal.bot), hz = pal.hz.map(v => v / 255);
  for (let j = 0; j < SH; j++) for (let i = 0; i < GW; i++) { const k = j * GW + i, t = sm(0, .78, j / SH), dx = (i - GW / 2) / GW, dy = (j - SH * .55) / GW,
    vig = 1 - .4 * sm(.2, .62, Math.hypot(dx, dy)), h = Math.pow(sm(SH - 60, SH, j), 1.4) * .1;
    SR[k] = (top[0] + (bot[0] - top[0]) * t) * vig * 1.5 + hz[0] * h; SG[k] = (top[1] + (bot[1] - top[1]) * t) * vig * 1.5 + hz[1] * h; SB[k] = (top[2] + (bot[2] - top[2]) * t) * vig * 1.5 + hz[2] * h; }
  const W = GW + 24, layers = [{ n: 1100, sp: .73, a: [.08, .26], tw: .05 }, { n: 300, sp: 1.67, a: [.2, .42], tw: .25 }, { n: 46, sp: 3, a: [.42, .7], tw: .7 }].map(L => {
    const S = []; let k = 0;
    while (S.length < L.n && k < L.n * 8) { k++; const px = r() * W, py = r() * SH, dens = .35 + .65 * sm(.35, .7, fbm(px / 87, py / 87, off + 7)); if (r() > dens) continue;
      const m = Math.pow(r(), 2.2), t = r();
      S.push({ x: px, y: py, a: L.a[0] + (L.a[1] - L.a[0]) * (1 - m), c: hex(t < .72 ? pal.tint[0] : t < .9 ? pal.tint[1] : pal.tint[2]), ph: r() * 6.28, f: .3 + r() * .9, tw: r() < L.tw }); }
    return { n: L.n, sp: L.sp, S, W }; });
  const rgb = a => hex('#' + a.map(v => v.toString(16).padStart(2, '0')).join(''));
  sky = { seed, pal, off, layers, cl: [rgb(pal.cl[0]), rgb(pal.cl[1])] };
  cloudT = -9;
}
// clouds: half-res fbm, bilinear upsample. Refreshed ~15x per second of sky time.
// Same formula as v8; the lattice hash H() is memoised per call (identical values, ~100x fewer sin() calls).
const HW = GW / 2, HH = SH / 2, hr = new Float32Array(HW * HH * 3), TW = 96, TH = 48;
const ctabs = [0, 1, 2].map(() => [0, 1, 2, 3].map(() => ({ d: new Float32Array(TW * TH), x0: 0, y0: 0 })));
function Hc(t, o, ix, iy) { const a = ix - t.x0, b = iy - t.y0; if (a < 0 || b < 0 || a >= TW || b >= TH) return H(ix + o, iy); const k = a * TH + b; let v = t.d[k]; if (v !== v) { v = H(ix + o, iy); t.d[k] = v; } return v; }
function vnc(px, py, o, t) { const ix = Math.floor(px), iy = Math.floor(py), fx = px - ix, fy = py - iy, sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
  const a = Hc(t, o, ix, iy), b = Hc(t, o, ix + 1, iy), c = Hc(t, o, ix, iy + 1), d = Hc(t, o, ix + 1, iy + 1); return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy; }
function fbmc(px, py, o, tabs) { let v = 0, a = .5, f = 1; for (let k = 0; k < 4; k++) { v += a * vnc(px * f, py * f, o, tabs[k]); f *= 2.03; a *= .5; } return v / .94; }
function prepTabs(tabs, axMin, ayMin) { let f = 1; for (let k = 0; k < 4; k++) { const t = tabs[k]; t.x0 = Math.floor(axMin * f) - 1; t.y0 = Math.floor(ayMin * f) - 1; t.d.fill(NaN); f *= 2.03; } }
let cycT = 0, cycRow = HH;                                  // sliced refresh state (live loop only)
function cloudRows(t, j0, j1) {
  const o = sky.off, ca = sky.cl[0], cb = sky.cl[1], tw = ctabs[0], tn = ctabs[1], tm = ctabs[2], sw = .3 * Math.sin(t * .05);
  if (j0 === 0) { prepTabs(tw, t * 3 / 420 + sw, 0); prepTabs(tn, t * 3 / 230, -t * .004); prepTabs(tm, t * 3 / 600 - t * .002, 0); }
  for (let j = j0; j < j1; j++) for (let i = 0; i < HW; i++) {
    const px = i * 6 + t * 3, py = j * 6, w = fbmc(px / 420 + sw, py / 420, o, tw), n = fbmc(px / 230 + w * 1.6, py / 230 + w * .8 - t * .004, o + 31, tn), m = fbmc(px / 600 - t * .002, py / 600, o + 57, tm);
    let a = sm(.5, .86, n) * (.55 + .45 * m) * sm(-10, BARY * .9, BARY - py + 40) * .3; if (a < 1e-5) a = 0;           // flush denormals
    const k = sm(.35, .65, m), q = (j * HW + i) * 3;
    for (let c = 0; c < 3; c++) hr[q + c] = (ca[c] + (cb[c] - ca[c]) * k) * a; }
}
function cloudUpsample(t) {
  const h = hr, cr = CR, cg = CG, cb = CB, sr = SR, sg = SG, sb = SB;
  for (let j = 0; j < SH; j++) for (let i = 0; i < GW; i++) {
    const fx = Math.min(HW - 1.001, i / 2), fy = Math.min(HH - 1.001, j / 2), i0 = Math.floor(fx), j0 = Math.floor(fy), u = fx - i0, v = fy - j0, k = j * GW + i;
    const q00 = (j0 * HW + i0) * 3, q10 = q00 + 3, q01 = q00 + HW * 3, q11 = q01 + 3;
    cr[k] = sr[k] + (h[q00] * (1 - u) + h[q10] * u) * (1 - v) + (h[q01] * (1 - u) + h[q11] * u) * v;
    cg[k] = sg[k] + (h[q00 + 1] * (1 - u) + h[q10 + 1] * u) * (1 - v) + (h[q01 + 1] * (1 - u) + h[q11 + 1] * u) * v;
    cb[k] = sb[k] + (h[q00 + 2] * (1 - u) + h[q10 + 2] * u) * (1 - v) + (h[q01 + 2] * (1 - u) + h[q11 + 2] * u) * v; }
  cloudT = t;
}
function clouds() { cloudRows(T, 0, HH); cloudUpsample(T); cycRow = HH; }            // full refresh (tests, sky swap)
// live loop: ~15 refreshes per second of sky time, each spread over 5 frames so no frame pays for the whole thing
function cloudsTick() {
  if (cycRow >= HH) { if (T - cloudT < .0625) return; cycT = T; cycRow = 0; }
  if (cycRow < HH) { const j1 = Math.min(HH, cycRow + 20); cloudRows(cycT, cycRow, j1); cycRow = j1; if (cycRow >= HH) cloudUpsample(cycT); }
}
// sky response to a ring front (pure): w in 0..1 for a bg star at distance d from the ring origin, ms after the click
function skyW(d, ms) {
  if (ms < 120 || ms > 1300) return 0;
  const r = ringRadius(ms), q = clamp01((d - 3) / 25), tp = 120 + 780 * (1 - Math.pow(1 - q, 1 / 3));
  const lead = clamp01((r - d + 2.5) / 2.5), decay = ms > tp ? Math.max(0, 1 - (ms - tp) / 350) : 1;
  return lead * decay;
}
// the base: gradient + clouds + bg stars (+ sky response). No sprites, glows or meteors.
let acts = [], actN = 0;
function composeBase() {
  BR.set(CR); BG.set(CG); BB.set(CB);
  for (let li = 0; li < 3; li++) { const L = sky.layers[li], S = L.S;
    for (let q = 0; q < S.length; q++) { const s = S[q], px = ((s.x - T * L.sp) % L.W + L.W) % L.W - 12; if (px < -3 || px > GW + 2) continue;
      let a = s.a * (.45 + .55 * sm(SH, SH - 55, s.y)); if (s.tw) a *= .62 + .38 * Math.pow(.5 + .5 * Math.sin(T * s.f + s.ph), 1.5);

      if (actN) { let w = 0; for (let m = 0; m < actN; m++) { const A = acts[m], dx = px - A.x, dy = s.y - A.y; w += skyW(Math.sqrt(dx * dx + dy * dy), A.ms); }
        if (w > 0) splat(px, s.y, s.c, Math.min(1, w) * .22); } } }
}
// meteors: pure function of T and the sky seed (one slot every 28 s, starts after 5 s)
function drawMeteor() {
  if (T < 5) return; const n = Math.floor((T - 5) / 28), sd = n + sky.seed * .137, st = 5 + n * 28 + H(sd, 4) * 18, u = T - st; if (u < 0 || u > 1.05) return;

  const e = 1 - Math.pow(1 - Math.min(1, u / .8), 2), hx = x0 + vx * e * 75, hy = y0 + vy * e * 75;
  const fade = (u < .7 ? Math.min(1, u / .1) : Math.max(0, 1 - (u - .7) / .35)) * .6, len = 24 * Math.min(1, u / .3);

// ↻ sky: snapshot the old composed base, build the new sky, crossfade 900 ms
function skySwap(seed, atT) {
  T = atT; clouds(); actN = 0; composeBase(); OR.set(BR); OG.set(BG); OB.set(BB);
  makeSky(seed); clouds(); xf = { t0: atT };

/* =====================================================================
   5. MODEL: stars, grow-only links, event replay
   ===================================================================== */
const DEF = [
  { n: 'hm one-pager',         gx: 268, gy: 40,  big: 1, life: .86, left: '6d 02h', full: 'fri 20 nov 23:59 · 6d 02h' },
  { n: 'dp · knapsack + lis',  gx: 96,  gy: 62,  done: 1, link: 2,    stamp: 'done · tue 10 nov 22:05' },
  { n: 'hm weekly report',     gx: 58,  gy: 118, done: 1, link: null, stamp: 'done · mon 9 nov 18:40' },
  { n: 'os linux hw 3',        gx: 186, gy: 128, life: .13, left: '26h',    full: 'sat 14 nov 23:59 · 26h' },
  { n: 'patterns quiz prep',   gx: 150, gy: 84,  life: .55, left: '3d 10h', full: 'tue 17 nov 08:00 · 3d 10h' },
  { n: 'read ch. 7 · os',      gx: 122, gy: 150, done: 1, link: 2,    stamp: 'done · thu 12 nov 21:10' },
  { n: 'mentor session notes', gx: 300, gy: 150, miss: 1, stamp: 'missed · wed 11 nov' }];
// pre-done links are stored (computed once in order: weekly report, knapsack, ch.7); never recomputed on load
const stars = DEF.map(d => Object.assign({ gx0: d.gx, gy0: d.gy, done: 0, link: null, miss: 0, big: 0, life: 0, left: '', full: '', stamp: '', fin: null, und: null,
  initDone: d.done || 0, initLink: d.link === undefined ? null : d.link, initStamp: d.stamp || '' }, d));
const NS = stars.length;
const R = s => s.big ? 5 : 3, CORE = s => s.big ? 2 : 1;
const Rb = s => s.miss ? 0 : R(s);                         // sprite bounding radius
const fmtT = at => String(10 + Math.floor(at / 60) % 50);

let events = [];                                           // {type:'finish'|'undo', at, si, hov}
let undoTarget = null;                                     // {si, at}: the latest finish that is still undoable
function nearestDone(si) { const s = stars[si]; let best = null, bd = 1e9;
  for (let j = 0; j < NS; j++) { if (j === si || !stars[j].done) continue; const d = Math.hypot(stars[j].gx - s.gx, stars[j].gy - s.gy); if (d < bd) { bd = d; best = j; } }
  return best; }
function edgeGeom(f, t) { const dx = t.gx - f.gx, dy = t.gy - f.gy, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, sA = R(f) + 1, sB = len - (R(t) + 1);
  return { ax: f.gx, ay: f.gy, ux, uy, len, sA, sB, path: Math.max(.1, sB - sA) }; }
function makeFin(si, at, hov) {
  const s = stars[si], link = s.link, o = { t0: at, link, reduced: REDUCED, hov, urgent: s.life < .25, line2: hov ? s.full : s.left };
  o.n2 = o.line2.length; o.tEnd = REDUCED ? 0 : 300 + o.n2 * 28; o.len = 0; o.path = 0; o.D = 0;
  if (link !== null) {
    const g = edgeGeom(stars[link], s); o.len = g.len; o.path = g.path; o.D = Math.min(1200, Math.max(520, g.len * 11));
    if (REDUCED) { o.chargeMs = 0; o.travelMs = 0; o.arriveMs = 300; }
    else { const pf = stars[link].fin, parentArr = pf ? pf.t0 + pf.arriveMs / 1000 : -1e9;     // causality: wait for the source to have received its light
      o.chargeMs = Math.max(450, (parentArr - at) * 1000); o.travelMs = o.chargeMs + 250; o.arriveMs = o.travelMs + o.D; }
  } else o.arriveMs = REDUCED ? 250 : 650;
  return o;
}

  for (let si = 0; si < NS; si++) drawSprite(si);
}

/* =====================================================================
   9. BLIT: grains to device pixels, drawn 1:1
   ===================================================================== */
function blit() {
  const W = GW * P, br = BR, bg = BG, bb = BB, px = u32, d = D, pp = P, lut = TONE;       // local aliases: global lookups are slow in hot loops
  for (let j = 0; j < SH; j++) { const row = j * pp * W;
    for (let i = 0; i < GW; i++) { const k = j * GW + i, r = br[k], g = bg[k], b = bb[k];
      const p = (255 << 24) | ((b <= 0 ? 0 : b >= 1 ? 255 : lut[(b * 4096) | 0]) << 16) | ((g <= 0 ? 0 : g >= 1 ? 255 : lut[(g * 4096) | 0]) << 8) | (r <= 0 ? 0 : r >= 1 ? 255 : lut[(r * 4096) | 0]), o = row + i * pp;
      for (let dy = 0; dy < d; dy++) { const oo = o + dy * W; for (let dx = 0; dx < d; dx++) px[oo + dx] = p; } } }
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.putImageData(img, 0, 0);
}
function setupCanvas() {
  dpr = window.devicePixelRatio || 1; P = Math.max(3, Math.round(3 * dpr)); D = P - Math.max(1, Math.round(dpr));
  cv.width = GW * P; cv.height = ROWS * P; cv.style.width = (cv.width / dpr) + 'px'; cv.style.height = (cv.height / dpr) + 'px';
  img = ctx.createImageData(GW * P, SH * P); u32 = new Uint32Array(img.data.buffer); u32.fill(BGPIX);
}

/* =====================================================================
   10. TEXT AND BAR (everything here sits on the grain grid)
   ===================================================================== */
let skyBtn = null, undoHit = null, msAvg = 0;
function dot(gx, gy, col, alpha) { ctx.globalAlpha = alpha; ctx.fillStyle = col; ctx.fillRect(gx * P, gy * P, D, D); }
function frameRect(x0, y0, x1, y1, col, alpha) { const t = Math.max(1, Math.round(dpr)); ctx.globalAlpha = alpha; ctx.fillStyle = col;
  ctx.fillRect(x0 * P, y0 * P, (x1 - x0) * P, t); ctx.fillRect(x0 * P, y1 * P - t, (x1 - x0) * P, t); ctx.fillRect(x0 * P, y0 * P, t, (y1 - y0) * P); ctx.fillRect(x1 * P - t, y0 * P, t, (y1 - y0) * P); }
function drawLabels() {
  ctx.textBaseline = 'middle';
  for (let si = 0; si < NS; si++) { const L = lab[si]; if (!L.shown) continue;
    if (frK[si] > .01) { ctx.setTransform(1, 0, 0, 1, 0, 0); frameRect(L.bx0, L.by0, L.bx1, L.by1, TXT.dim, frK[si]);
      ctx.setTransform(P / 3, 0, 0, P / 3, 0, 0); ctx.globalAlpha = frK[si]; ctx.fillStyle = TXT.dim; ctx.font = '400 12px ' + FONT; ctx.fillText('⏎', (L.bx1 + 2) * 3, (L.y0 + 3) * 3 + 1); }
    ctx.setTransform(P / 3, 0, 0, P / 3, 0, 0);
    ctx.globalAlpha = L.a1; ctx.font = L.w1 + ' 12px ' + FONT; ctx.fillStyle = css(L.c1); ctx.fillText(L.title, L.ax * 3, (L.y0 + 3) * 3 + 1);
    if (L.t2) { ctx.globalAlpha = L.a2; ctx.font = '400 12px ' + FONT; ctx.fillStyle = css(L.c2); ctx.fillText(L.t2, L.ax * 3, (L.y0 + 9) * 3 + 1); } }
  ctx.globalAlpha = 1;
}
function pipColor(k, arr) {            // pip colour for the k-th pip in sorted-arrival order
  if (k >= arr.length || arr[k] > T) return K.pipOff; const e = (T - arr[k]) * 1000;
  return e < 80 ? mixTo([0, 0, 0], K.pipOff, C.core, e / 80) : e < 280 ? mixTo([0, 0, 0], C.core, C.done, (e - 80) / 200) : C.done;
}
function drawBar() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = TXT.bg; ctx.fillRect(0, SH * P, cv.width, cv.height - SH * P);
  ctx.fillStyle = TXT.rule; ctx.fillRect(0, SH * P, cv.width, Math.max(1, Math.round(dpr)));
  ctx.setTransform(P / 3, 0, 0, P / 3, 0, 0); ctx.textBaseline = 'middle'; const by = 618;
  ctx.font = '500 12px ' + FONT; ctx.fillStyle = TXT.ink2; ctx.fillText('›', 18, by);
  if (Math.floor(T * 1.8) % 2 === 0) { ctx.fillStyle = TXT.ink2; ctx.fillRect(33, 609, 6, 18); }
  const ua = undoTarget ? (T - undoTarget.at < 5 ? 1 : 1 - seg(T - undoTarget.at, 5, 5.3)) : 0; undoHit = null;
  if (ua < 1) { ctx.globalAlpha = 1 - ua; ctx.font = '400 12px ' + FONT; ctx.fillStyle = TXT.dim; ctx.fillText('title, deadline', 51, by); ctx.globalAlpha = 1; }
  if (ua > 0 && undoTarget) {
    let t = stars[undoTarget.si].n; if (t.length > 28) t = t.slice(0, 27) + '…'; ctx.font = '400 12px ' + FONT; ctx.globalAlpha = ua;
    const parts = [['finished · ', TXT.dim], [t, TXT.ink2], ['    ', TXT.dim], ['undo', TXT.ink2], ['  ', TXT.dim], ['z', TXT.dim]]; let x = 51;
    for (let p = 0; p < parts.length; p++) { ctx.fillStyle = parts[p][1]; ctx.fillText(parts[p][0], x, by); const w = ctx.measureText(parts[p][0]).width; if (p === 3) undoHit = { x0: x / 3, x1: (x + w) / 3 }; x += w; }
    const wgr = Math.ceil((x - 51) / 3), rem = Math.ceil(wgr * (1 - clamp01((T - undoTarget.at) / 5)));        // the 5 s timer: a row of grains draining right to left
    ctx.setTransform(1, 0, 0, 1, 0, 0); for (let g = 0; g < rem; g++) dot(17 + g, 210, TXT.dim, ua); ctx.globalAlpha = 1;
    ctx.setTransform(P / 3, 0, 0, P / 3, 0, 0); }
  // counter: pips fill at the arrival of each connection
  const arr = []; for (let i = 0; i < NS; i++) { const s = stars[i]; if (s.done) arr.push(s.fin ? s.fin.t0 + s.fin.arriveMs / 1000 : -1e9); } arr.sort((a, b) => a - b);
  let cnt = 0; for (let i = 0; i < arr.length; i++) if (arr[i] <= T) cnt++;
  const cs = cnt + ' / ' + NS; ctx.font = '500 12px ' + FONT; const cw = ctx.measureText(cs).width; ctx.fillStyle = TXT.ink2; ctx.fillText(cs, Math.floor((UW - 18 - cw) / 3) * 3, by);
  let vac = -1, vk = 0; for (let i = 0; i < NS; i++) { const s = stars[i]; if (!s.done && s.und && US[i] && s.und.pipWasOn) { vac = cnt; vk = US[i].pipK; } }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  for (let k = 0; k < NS; k++) { const gx = Math.floor((UW - 30 - cw) / 3) - (NS - k) * 3; let c = pipColor(k, arr); if (k === vac && vk > 0) c = mixTo([0, 0, 0], K.pipOff, C.done, vk);
    dot(gx, 205, css(c), 1); dot(gx, 206, css(c), 1); }
  ctx.setTransform(P / 3, 0, 0, P / 3, 0, 0); ctx.font = '400 12px ' + FONT;
  const bx = Math.floor((UW - 48 - cw - NS * 9 - 54) / 3) * 3; skyBtn = { x: bx - 6, y: BARY + 10, w: 66, h: 40 }; ctx.fillStyle = skyBtn.hover ? TXT.ink2 : TXT.dim; ctx.fillText('↻ sky', bx, by);
  if (DEBUG) { ctx.fillStyle = TXT.dim; ctx.font = '400 12px ' + FONT; ctx.fillText(msAvg.toFixed(1) + ' ms/frame · P' + P + ' D' + D + ' dpr' + dpr, 9, 12); }
}

/* =====================================================================
   11. INPUT
   ===================================================================== */
function toUnits(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) / r.width * UW, (e.clientY - r.top) / r.height * UH]; }
const inBtn = (px, py) => skyBtn && px >= skyBtn.x && px <= skyBtn.x + skyBtn.w && py >= skyBtn.y && py <= skyBtn.y + skyBtn.h;
function hitStar(px, py) {
  const gx = px / 3, gy = py / 3; let best = -1, bd = 1e9;
  for (let i = 0; i < NS; i++) { const s = stars[i], r = Rb(s) + 2, L = lab[i]; let hit = Math.abs(gx - s.gx) <= r && Math.abs(gy - s.gy) <= r;
    if (!hit && L.shown && L.bx0 !== undefined && (!stars[i].miss || hk[i] > 0)) hit = gx >= L.bx0 && gx <= L.bx1 && gy >= L.by0 && gy <= L.by1;
    if (hit) { const d = Math.abs(gx - s.gx) + Math.abs(gy - s.gy); if (d < bd) { bd = d; best = i; } } }
  return best;
}
function wake() { animating = true; }
function finishFocused() { const i = focus; if (i >= 0 && doFinish(i, T, true)) { selIdx = -1; wake(); } }
function tryUndo() { if (undoTarget && T - undoTarget.at < 5) { doUndo(T); wake(); } }
function aliveByGx() { return stars.map((s, i) => i).filter(i => !stars[i].done && !stars[i].miss).sort((a, b) => stars[a].gx - stars[b].gx); }
function bindInput() {
  cv.addEventListener('mousemove', e => { const [px, py] = toUnits(e); if (skyBtn) skyBtn.hover = inBtn(px, py); mouseHover = hitStar(px, py);
    const onUndo = undoHit && undoTarget && T - undoTarget.at < 5 && Math.abs(py - 618) < 12 && px / 3 >= undoHit.x0 && px / 3 <= undoHit.x1;
    cv.style.cursor = (mouseHover >= 0 || inBtn(px, py) || onUndo) ? 'pointer' : 'default'; });
  cv.addEventListener('mouseleave', () => { mouseHover = -1; });
  cv.addEventListener('click', e => { const [px, py] = toUnits(e);
    if (inBtn(px, py)) { skySwap(Math.floor(Math.random() * 1e9), T); wake(); return; }
    if (undoHit && undoTarget && T - undoTarget.at < 5 && Math.abs(py - 618) < 12 && px / 3 >= undoHit.x0 && px / 3 <= undoHit.x1) { tryUndo(); return; }
    const i = hitStar(px, py); if (i >= 0) { focus = i; finishFocused(); } });
  window.addEventListener('keydown', e => {
    if (e.key === 'Tab') { e.preventDefault(); const l = aliveByGx(); if (!l.length) return; let k = l.indexOf(selIdx); k = e.shiftKey ? (k <= 0 ? l.length - 1 : k - 1) : (k + 1) % l.length; selIdx = l[k]; mouseHover = -1; wake(); }
    else if (e.key === 'Enter') { if (focus >= 0) { finishFocused(); } }
    else if (e.key === 'Escape') { selIdx = -1; wake(); }
    else if ((e.key === 'z' || e.key === 'Z')) { tryUndo(); } });
}

/* =====================================================================
   12. LOOP
   ===================================================================== */
let frozen = false, rafId = 0, lastTs = 0, tick = 0;
function updateHover(dt) {
  for (let i = 0; i < NS; i++) { const tgt = focus === i ? 1 : 0, rate = tgt > hp[i] ? dt / .15 : dt / .2;
    hp[i] = tgt > hp[i] ? Math.min(tgt, hp[i] + rate) : Math.max(tgt, hp[i] - rate); hk[i] = ease.out(hp[i]);
    const ft = (focus === i && !stars[i].done && !stars[i].miss) ? 1 : 0; frK[i] = ft > frK[i] ? Math.min(1, frK[i] + dt / .15) : Math.max(0, frK[i] - dt / .2); }
}
function render() {
  const t0 = performance.now(); prepare(); compose(); blit(); const ms = performance.now() - t0; msAvg = msAvg ? msAvg * .9 + ms * .1 : ms;
  drawLabels(); drawBar();
}
function loop(ts) {
  rafId = requestAnimationFrame(loop);
  if (!lastTs) lastTs = ts; const dt = Math.min(.05, (ts - lastTs) / 1000); lastTs = ts; T += dt; tick++;
  focus = forceFocus !== null ? forceFocus : mouseHover >= 0 ? mouseHover : selIdx; updateHover(dt);
  if (!animating && (tick & 1)) return;                    // ambient: 30 fps; any choreography / hover / crossfade: 60 fps
  render();
}
document.addEventListener('visibilitychange', () => { if (document.hidden) cancelAnimationFrame(rafId); else if (!frozen) { lastTs = 0; rafId = requestAnimationFrame(loop); } });

/* =====================================================================
   13. TEST HOOKS
   ===================================================================== */
const findStar = n => { const k = stars.findIndex(s => s.n === n); return k >= 0 ? k : stars.findIndex(s => s.n.indexOf(n) >= 0); };
window.ns = {
  setSeed(n) { makeSky(n); },
  freeze(t) { frozen = true; cancelAnimationFrame(rafId); T = t; ns.render(); },
  finish(name, atT, hov) { return doFinish(findStar(name), atT, hov); },
  undo(atT) { doUndo(atT); },
  hover(name) { forceFocus = name === null ? null : findStar(name); const f = forceFocus === null ? -1 : forceFocus; focus = f;
    for (let i = 0; i < NS; i++) { hp[i] = hk[i] = i === f ? 1 : 0; frK[i] = (i === f && !stars[i].done && !stars[i].miss) ? 1 : 0; } },
  skySwap(seed, atT) { skySwap(seed, atT); },
  move(name, gx, gy) { const s = stars[findStar(name)]; s.gx = gx; s.gy = gy; },
  render() { cloudT = -9; focus = forceFocus !== null ? forceFocus : mouseHover >= 0 ? mouseHover : selIdx; render(); },
  bench(n) { const t0 = T; let sum = 0, mx = 0, fr = []; cancelAnimationFrame(rafId); frozen = false; cloudT = -9;
    for (let i = 0; i < n; i++) { T = t0 + i / 60; const a = performance.now(); prepare(); compose(); blit(); const d = performance.now() - a; sum += d; fr.push(d); if (i > 10) mx = Math.max(mx, d); }
    frozen = true; fr.sort((x, y) => x - y); return { avg: sum / n, median: fr[n >> 1], p95: fr[Math.floor(n * .95)], max: mx }; },
  now() { return T; },
  stats() { return { ms: msAvg, grains: N, dpr, P, D }; }
};

/* ---------- boot ---------- */
(async function boot() {
  cv = document.getElementById('c'); ctx = cv.getContext('2d'); setupCanvas();
  const fontsReady = Promise.race([Promise.all([document.fonts.load('400 12px "IBM Plex Mono"'), document.fonts.load('500 12px "IBM Plex Mono"')]), new Promise(r => setTimeout(r, 3000))]);
  makeSky(Q.has('seed') ? +Q.get('seed') : Math.floor(Math.random() * 1e9));
  await fontsReady; widthCache.clear();
  const scene = Q.get('scene'), at = Q.has('at') ? +Q.get('at') : null; let tFreeze = Q.has('t') ? +Q.get('t') : 0, freeze = Q.get('freeze') === '1';
  const sname = Q.get('star');
  if (scene === 'finish' || scene === 'urgent') { const nm = sname || (scene === 'urgent' ? 'os linux hw 3' : 'patterns quiz prep'); ns.finish(nm, 2.0, false); tFreeze = 2.0 + (at === null ? 850 : at) / 1000; freeze = true; }
  else if (scene === 'overlap') { ns.finish('patterns quiz prep', 2.0, false); ns.finish('os linux hw 3', 2.3, false); tFreeze = 2.0 + (at === null ? 1200 : at) / 1000; freeze = true; }
  else if (scene === 'undo') { ns.finish(sname || 'patterns quiz prep', 2.0, false); ns.undo(4.0); tFreeze = Q.has('t') ? tFreeze : 4.0 + (at === null ? 350 : at) / 1000; freeze = true; }
  else if (scene === 'labels') { ns.move('hm one-pager', 394, 40); ns.move('os linux hw 3', 62, 90); ns.move('patterns quiz prep', 392, 124); freeze = true; }
  else if (scene === 'crossfade') { ns.skySwap(+(Q.get('seed2') || 11), tFreeze); tFreeze += (at === null ? 450 : at) / 1000; freeze = true; }
  if (Q.has('hover')) ns.hover(Q.get('hover'));
  bindInput();
  window.addEventListener('resize', () => { if (Math.abs((window.devicePixelRatio || 1) - dpr) > .001) { setupCanvas(); widthCache.clear(); } });
  if (Q.get('bench') === '1') { const r = ns.bench(+Q.get('frames') || 120); document.title = 'bench ' + JSON.stringify(r) + ' P' + P + ' D' + D; return; }
  if (freeze) ns.freeze(tFreeze); else { T = tFreeze; ns.render(); requestAnimationFrame(ts => { lastTs = ts; rafId = requestAnimationFrame(loop); }); }
  document.documentElement.setAttribute('data-ready', '1');
})();
</script>
