[package]
name = "night-sky-desktop"
version = "11.0.0"
edition = "2021"

[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-window-state = "2"

[profile.release]
opt-level = "s"
lto = true
strip = true
